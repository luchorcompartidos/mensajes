name: Compilar APK

# Estándar de versiones de la caja de apps (SemVer, siempre tres números):
#   - Sin marca en el commit (o "[skip release]"): compila de prueba, NO publica Release
#     (el APK queda en Actions > Artifacts).
#   - "[patch]" en el mensaje:  v0.0.1 -> v0.0.2  (la primera Release con patch es v0.0.1)
#   - "[minor]" en el mensaje:  v0.0.2 -> v0.1.0
#   - "[major]" en el mensaje:  v0.1.0 -> v1.0.0
# Cada Release adjunta dos copias del mismo APK: con versión (programador-mensajes-X.Y.Z.apk)
# y con nombre fijo (programador-mensajes.apk) para el link de Mi Panel:
#   https://github.com/luchorcompartidos/mensajes/releases/latest/download/programador-mensajes.apk
# El número va compilado en la app (versionName). La app lee las Releases para mostrar el
# Changelog y avisar si hay una versión nueva, con link al instalador (.apk adjunto).

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      marca:
        description: 'Tipo de versión'
        type: choice
        options: [ prueba, patch, minor, major ]
        default: prueba

permissions:
  contents: write

concurrency:
  group: compilar
  cancel-in-progress: false

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true   # nucleo/ = luchorcompartidos/nucleo-android

      - name: Calcular versión
        env:
          MSG: ${{ github.event.head_commit.message }}
          MARCA: ${{ inputs.marca }}
        run: |
          if grep -q '\[skip release\]' <<< "$MSG" && [ -z "$MARCA" ]; then tipo=prueba
          elif [ "$MARCA" = "major" ] || { [ -z "$MARCA" ] && grep -q '\[major\]' <<< "$MSG"; }; then tipo=major
          elif [ "$MARCA" = "minor" ] || { [ -z "$MARCA" ] && grep -q '\[minor\]' <<< "$MSG"; }; then tipo=minor
          elif [ "$MARCA" = "patch" ] || { [ -z "$MARCA" ] && grep -q '\[patch\]' <<< "$MSG"; }; then tipo=patch
          else tipo=prueba
          fi
          last=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          IFS=. read -r X Y Z <<< "${last#v}"
          if [ "$tipo" = "prueba" ]; then
            echo "Compilación de prueba: no se publica Release."
          elif [ -z "$last" ]; then
            case "$tipo" in
              major) next="1.0.0" ;;
              minor) next="0.1.0" ;;
              patch) next="0.0.1" ;;
            esac
          else
            case "$tipo" in
              major) next="$((X+1)).0.0" ;;
              minor) next="$X.$((Y+1)).0" ;;
              patch) next="$X.$Y.$((Z+1))" ;;
            esac
          fi
          echo "TIPO=$tipo" >> "$GITHUB_ENV"
          [ -n "$next" ] && echo "VERSION_NAME=$next" >> "$GITHUB_ENV"
          echo "Última: ${last:-ninguna} -> Nueva: ${next:-(prueba)}"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Preparar firma
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/firma.p12"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/firma.p12" >> "$GITHUB_ENV"
          else
            echo "::warning::Falta el secreto KEYSTORE_B64: el APK se firma con una clave temporal y no podrá actualizar a versiones anteriores."
          fi

      - name: Compilar
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
        run: gradle assembleRelease --no-daemon

      - name: Guardar APK de prueba
        if: env.TIPO == 'prueba'
        uses: actions/upload-artifact@v4
        with:
          name: programador-mensajes-prueba-${{ github.run_number }}
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 7

      - name: Publicar versión
        if: env.TIPO != 'prueba'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="$VERSION_NAME"
          cp app/build/outputs/apk/release/app-release.apk "programador-mensajes-$V.apk"
          cp app/build/outputs/apk/release/app-release.apk "programador-mensajes.apk"
          git tag "v$V"
          git push origin "v$V"
          gh release create "v$V" "programador-mensajes-$V.apk" "programador-mensajes.apk" \
            --title "Programador de Mensajes $V" \
            --notes "$(git log -1 --pretty=%s | sed -E 's/ *\[(patch|minor|major)\]//g')" \
            --latest
